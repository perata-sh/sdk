name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      # The tests run TypeScript directly, which Node does from 22.18.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The oldest version each SDK promises, so nothing newer slips in.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, json
          tools: phpstan
      - run: pip install mypy
      - run: ./check.sh
        env:
          CHECK_DRIFT: '1'
